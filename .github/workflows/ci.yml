name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      # soundfile is PINNED, not >=. 0.14 moved "import numpy" to module
      # level; 0.13.1 keeps it lazy inside the functions that need arrays.
      # test_normalizing_never_imports_numpy asserts the conversion path
      # never pulls numpy in - a real property of the shipped app, which
      # bundles soundfile but not numpy - so an unpinned install here would
      # fail CI for a reason that has nothing to do with the code.
      - run: pip install pyaaf2==1.7.1 soundfile==0.13.1 numpy
      - run: python3 tests/run_tests.py
